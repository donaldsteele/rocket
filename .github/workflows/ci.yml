name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 1.26.x builds the releases (go.mod stays at go 1.26.0); 1.27.x
        # makes sure the code and its tests hold on the newer toolchain too.
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            tray/go.sum

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l cmd internal tools web tray mobile)"
          [ -z "$out" ] || { echo "needs gofmt:"; echo "$out"; exit 1; }

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: vet for the other release OSes
        shell: bash
        run: |
          for os in windows darwin linux; do
            [ "$os" = "$(go env GOOS)" ] && continue
            echo "GOOS=$os go vet ./..."
            GOOS=$os go vet ./...
          done

      - name: third-party license file is up to date
        run: go run ./tools/licenses -check

      - name: test
        run: go test ./...

      - name: race test
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      # The tray is its own module (tray/go.mod); the root ./... skips it.
      - name: tray vet and test
        working-directory: tray
        run: |
          go vet ./...
          go test ./...

      - name: tray build (Windows, Linux; no cgo)
        if: matrix.os != 'macos-latest'
        working-directory: tray
        shell: bash
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -o "$RUNNER_TEMP/rocket-tray-$arch" .
          done

      - name: tray build (macOS; needs cgo)
        if: matrix.os == 'macos-latest'
        working-directory: tray
        run: go build -o "$RUNNER_TEMP/rocket-tray" .

      # Release zips are built with the release toolchain only.
      - name: release build (bash, 6 zips)
        if: matrix.go == '1.26.x' && matrix.os != 'windows-latest'
        shell: bash
        run: VERSION=ci-${GITHUB_SHA::7} bash scripts/build.sh

      - name: release build (PowerShell, 6 zips)
        if: matrix.go == '1.26.x' && matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build.ps1 -Version "ci-$($env:GITHUB_SHA.Substring(0,7))"

      - name: check release zips
        if: matrix.go == '1.26.x'
        shell: bash
        run: |
          ls -l dist
          test "$(ls dist/rocket-*.zip | wc -l)" -eq 6
          test "$(wc -l < dist/SHA256SUMS)" -eq 6
          cd dist && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi

      - name: upload release zips
        if: matrix.go == '1.26.x' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: rocket-dist
          path: |
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 7

  # The Android app, debug build only. Release signing needs the keystore,
  # which never goes into CI; the release APK is built locally by
  # scripts/build.sh / build.ps1.
  android:
    name: android (debug APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: '30.0.16248370'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts

      - name: Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes dies of SIGPIPE when sdkmanager exits; don't let pipefail see it.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # gomobile and gobind at the golang.org/x/mobile version pinned in go.mod.
      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          "$(go env GOPATH)/bin/gomobile" init

      - name: Go core (rocketcore.aar)
        run: bash scripts/build-android.sh --aar-only

      - name: test, lint, assemble
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rocket-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rocket-android-lint
          path: android/app/build/reports/
          retention-days: 7
