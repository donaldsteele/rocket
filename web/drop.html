<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>rocket - send files to this computer</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="drop.js" defer></script>
</head>
<body class="droppage">
<a class="skip" href="#main">Skip to content</a>
<header class="bar" role="banner">
  <div class="brand mono"><img src="favicon.png" alt=""><span>rocket</span></div>
  <p class="selfline"><span class="muted">Send files to</span> <strong id="host" class="wrapany">this computer</strong></p>
</header>
<main id="main" tabindex="-1">
  <section class="card dropcard" aria-labelledby="drop-h">
    <h1 id="drop-h">Send files</h1>
    <p class="lead">Pick files on this device and they are copied to <span id="host2">this computer</span> over your local network.</p>
    <div class="drop" id="zone">
      <svg class="ico hero" aria-hidden="true" focusable="false"><use href="icons.svg#i-upload"></use></svg>
      <p><button type="button" class="primary big" id="choose" aria-describedby="drop-how">Choose files</button></p>
      <p id="drop-how">or drag files here.</p>
      <input type="file" id="picker" class="sr" multiple tabindex="-1" aria-hidden="true">
    </div>
    <p class="sub">The person at that computer is asked to accept the first time. After that, this browser can send without asking for 30 days.</p>
    <div id="status" class="alert" role="status" aria-live="polite" hidden></div>
    <ul class="plain" id="files" aria-label="Files"></ul>
  </section>
</main>
</body>
</html>
